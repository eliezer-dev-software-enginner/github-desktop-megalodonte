name: Build AppImage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Megalodonte Git
        uses: actions/checkout@v4

      - name: Check out Megalodonte framework
        shell: bash
        run: |
          set -euo pipefail
          clone() {
            git clone --depth 1 "$1" "$2"
          }
          owner=eliezer-dev-software-enginner
          for project in megalodonte-script-app megalodonte-jsonc-ui; do
            clone "https://github.com/$owner/$project.git" "../$project"
          done
          libraries="../../megalodonte-ecossystem/megalodonte-libs"
          mkdir -p "$libraries"
          for project in megalodonte-core megalodonte-base megalodonte-components megalodonte-theme; do
            clone "https://github.com/$owner/$project.git" "$libraries/$project"
          done
          clone "https://github.com/$owner/megalodonte-packaging.git" "$RUNNER_TEMP/megalodonte-packaging"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          java-package: jdk+jmods
          cache: gradle

      - name: Install JavaFX SDK and appimagetool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/javafx.zip" \
            https://download2.gluonhq.com/openjfx/25.0.1/openjfx-25.0.1_linux-x64_bin-sdk.zip
          unzip -q "$RUNNER_TEMP/javafx.zip" -d "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/javafx"
          mv "$RUNNER_TEMP/javafx-sdk-25.0.1" "$RUNNER_TEMP/javafx/linux-25.0.1"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool-x86_64.AppImage"

      - name: Test
        run: xvfb-run -a bash ./gradlew test --no-daemon

      - name: Build AppImage with megalodonte-packaging
        env:
          JAVAFX_MODULES_HOME: ${{ runner.temp }}/javafx
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          MEGALODONTE_PACKAGING_HOME: ${{ runner.temp }}/megalodonte-packaging
        run: python3 scripts/package.py build appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: megalodonte-git-linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error
